[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-presales-lab"
version = "0.1.0"
description = "A reproducible AI presales portfolio: Dify solution assistant and llama.cpp inference benchmark."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
demo = ["gradio>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
