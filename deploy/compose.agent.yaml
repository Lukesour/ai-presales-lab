services:
  presales-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    ports:
      - "8090:8090"
    volumes:
      - agent-checkpoints:/var/lib/ai-presales
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  agent-checkpoints:
