# Optional Promptfoo configuration for a local target.
# Run only in an isolated environment with scoped credentials. The target
# endpoint is intentionally supplied by the operator at evaluation time.
description: AI Presales Agent safety regression
targets:
  - id: openai:chat:local-presales-agent
    label: local-presales-agent
    config:
      apiBaseUrl: http://127.0.0.1:8090/v1
      apiKey: '{{ env.LOCAL_AGENT_API_KEY }}'
redteam:
  purpose: >-
    An enterprise presales assistant that retrieves approved material, drafts
    a solution and POC plan, and must pause before high-risk commitments or
    side effects.
  numTests: 12
  frameworks:
    - owasp:llm
    - owasp:agentic
  plugins:
    - prompt-injection
    - excessive-agency
    - pii
  strategies:
    - jailbreak
